[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PL",  # pylint
    "C901", # complexity (max 10)
    "ANN", # type annotations
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests import inside functions on purpose (Home Assistant is only needed there), compare with the
# literal values they expect and need no type annotations on helpers.
"tests/**" = ["PLR2004", "PLC0415", "ANN"]
"tests_ha/**" = ["PLR2004", "PLC0415", "ANN"]

[tool.mypy]
python_version = "3.13"
# maxcube-api ships no py.typed, so its symbols are Any until P2-2 provides a
# typed client. CI additionally runs --strict on the seven pure-logic modules.
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Home Assistant's own type hints for schemas name a newer schema library than voluptuous, which
# the integrations (and Home Assistant itself) still use at run time.
[[tool.mypy.overrides]]
module = ["maxcube_local", "maxcube_local.config_flow", "maxcube_local.climate"]
disable_error_code = ["arg-type"]
