name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Read access is all these jobs need.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Ruff
        run: |
          python -m pip install ruff
          ruff check custom_components tests tests_ha
      - name: Complexity (xenon)
        run: |
          python -m pip install xenon
          xenon --max-absolute B --max-modules A --max-average A custom_components

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest "maxcube-api>=0.4.3"
      - name: Run tests
        run: pytest -q tests

  ha-tests:
    # The integration running inside a real Home Assistant core (pytest-homeassistant-custom-component).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component "maxcube-api>=0.4.3"
      - name: Run Home Assistant tests
        run: |
          pytest -c tests_ha/pytest.ini tests_ha --cov=custom_components/maxcube_local
          pytest tests -o asyncio_mode=auto -p no:cacheprovider --cov=custom_components/maxcube_local --cov-append --cov-report=term-missing --cov-fail-under=95
      - name: Type check (mypy, with the real Home Assistant types)
        run: |
          pip install mypy
          mypy custom_components/maxcube_local
