name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ruff
        run: |
          python -m pip install ruff
          ruff check custom_components tests tests_ha

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest "maxcube-api>=0.4.3"
      - name: Run tests
        run: pytest -q tests

  ha-tests:
    # The integration running inside a real Home Assistant core (pytest-homeassistant-custom-component).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component "maxcube-api>=0.4.3"
      - name: Run Home Assistant tests
        run: |
          pytest -c tests_ha/pytest.ini tests_ha --cov=custom_components/maxcube_local
          pytest tests -o asyncio_mode=auto -p no:cacheprovider --cov=custom_components/maxcube_local --cov-append --cov-report=term-missing --cov-fail-under=95
      - name: Type check (mypy, with the real Home Assistant types)
        run: |
          pip install mypy
          mypy custom_components/maxcube_local
