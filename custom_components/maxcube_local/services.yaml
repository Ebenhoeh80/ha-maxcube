reconnect:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: maxcube_local

reboot:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: maxcube_local

get_schedule:
  target:
    entity:
      integration: maxcube_local
      domain: climate

set_schedule:
  target:
    entity:
      integration: maxcube_local
      domain: climate
  fields:
    days:
      required: false
      example: '["monday", "tuesday", "wednesday", "thursday", "friday"]'
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    periods:
      required: false
      example: '[{"until": "06:00", "temperature": 17}, {"until": "08:00", "temperature": 21}, {"until": "24:00", "temperature": 17}]'
      selector:
        object:
    by_day:
      required: false
      example: '{"monday": [{"until": "24:00", "temperature": 17}], "saturday": [{"until": "08:00", "temperature": 19}, {"until": "24:00", "temperature": 21}]}'
      selector:
        object:
    dry_run:
      required: false
      default: false
      selector:
        boolean:

copy_schedule:
  fields:
    source:
      required: true
      selector:
        entity:
          integration: maxcube_local
          domain: climate
    targets:
      required: true
      selector:
        entity:
          integration: maxcube_local
          domain: climate
          multiple: true
    days:
      required: false
      example: '["saturday", "sunday"]'
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
